<!DOCTYPE html>
<html>
<head>
<title>😂 Meme Maker</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@400;600&display=swap');

* {
    box-sizing: border-box;
}


body {
    font-family: 'Poppins', sans-serif;
    background:
    radial-gradient(circle at top, #6366f1, transparent 40%),
    linear-gradient(135deg,#111827,#020617);

    min-height:100vh;
    color:white;
    text-align:center;
    padding:30px;
}


.container {

    max-width:700px;
    margin:auto;

    background:rgba(255,255,255,0.1);

    backdrop-filter:blur(15px);

    padding:35px;

    border-radius:25px;

    box-shadow:
    0 20px 50px rgba(0,0,0,0.4);

}



h1 {

    font-family:'Luckiest Guy';
    font-size:55px;

    color:#facc15;

    text-shadow:
    3px 3px #000;

}



p {

    color:#ddd;
    font-size:18px;

}



input {

    background:white;

    border:none;

    padding:12px;

    margin:8px;

    border-radius:12px;

    font-size:16px;

}



input[type=file] {

    background:#2563eb;

    color:white;

    cursor:pointer;

}

.upload-btn {

    display:inline-block;

    background:rgba(255,255,255,0.12);

    border:2px solid rgba(255,255,255,0.25);

    color:white;

    padding:14px 25px;

    border-radius:50px;

    font-weight:bold;

    cursor:pointer;

    margin:10px;

    backdrop-filter:blur(10px);

    transition:0.3s;

}


.upload-btn:hover {

    background:rgba(255,255,255,0.25);

    border-color:#facc15;

    transform:translateY(-3px);

    box-shadow:0 8px 20px rgba(250,204,21,0.3);

}


.upload-btn input {

    display:none;

}





button:hover {

    transform:scale(1.08);

    box-shadow:
    0 10px 25px rgba(236,72,153,.5);

}



canvas {

    margin-top:25px;

    max-width:100%;

    border-radius:15px;

    box-shadow:
    0 10px 30px black;

}



</style>

</head>

<body>

<div class="container">

<h1>😂 Meme Maker</h1>

<p>Add text to images and make memes!</p>

<input type="file" id="imageInput">

<br>

<input id="topText" placeholder="Top text">

<input id="bottomText" placeholder="Bottom text">

<br>

<button onclick="makeMeme()">Create Meme</button>

<button onclick="downloadMeme()">Download</button>

<br><br>

<canvas id="canvas"></canvas>


</div>


<script>

let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let image = new Image();


document.getElementById("imageInput").onchange = function(e){

let file = e.target.files[0];

let reader = new FileReader();

reader.onload=function(event){

image.onload=function(){

canvas.width=image.width;
canvas.height=image.height;

ctx.drawImage(image,0,0);

}

image.src=event.target.result;

}

reader.readAsDataURL(file);

}



function makeMeme(){

ctx.drawImage(image,0,0);


ctx.fillStyle="white";
ctx.strokeStyle="black";
ctx.lineWidth=5;

ctx.font="40px Impact";
ctx.textAlign="center";


ctx.strokeText(
document.getElementById("topText").value,
canvas.width/2,
50
);

ctx.fillText(
document.getElementById("topText").value,
canvas.width/2,
50
);


ctx.strokeText(
document.getElementById("bottomText").value,
canvas.width/2,
canvas.height-30
);

ctx.fillText(
document.getElementById("bottomText").value,
canvas.width/2,
canvas.height-30
);


}



function downloadMeme(){

let link=document.createElement("a");

link.download="meme.png";

link.href=canvas.toDataURL();

link.click();

}


</script>

</body>
</html>
