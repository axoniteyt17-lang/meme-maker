<!DOCTYPE html>
<html>
<head>
<title>MemeMaker</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#4b0082,#9b59ff);
    color: white;
    text-align: center;
}

.container {
    max-width: 900px;
    margin:auto;
    padding:20px;
}

h1 {
    font-size:48px;
}

.card {
    background:rgba(255,255,255,0.15);
    padding:20px;
    border-radius:20px;
    margin:20px 0;
}

input, select {
    width:100%;
    padding:12px;
    margin:8px 0;
    border-radius:10px;
    border:none;
    font-size:16px;
}

button {
    background:#b026ff;
    color:white;
    border:none;
    padding:12px 20px;
    margin:5px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
}

button:hover {
    transform:scale(1.05);
}

canvas {
    max-width:100%;
    border-radius:15px;
    background:white;
}

.controls {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}


#alertBox {
    display:none;
    background:#111;
    color:white;
    padding:25px;
    border-radius:20px;
    margin-top:20px;
    font-size:20px;
}


@media(max-width:600px){

h1 {
    font-size:32px;
}

button {
    width:100%;
}

}

</style>

</head>

<body>

<div class="container">

<h1>😂 MemeMaker</h1>


<div class="card">

<h2>Create your meme</h2>

<input type="file" id="imageUpload" accept="image/*">


<div class="controls">

<div>
<label>Top Text</label>
<input id="topText" placeholder="Top text">
</div>


<div>
<label>Bottom Text</label>
<input id="bottomText" placeholder="Bottom text">
</div>


<div>
<label>Text Size</label>
<input type="range" id="textSize" min="20" max="80" value="40">
</div>

</div>


<button onclick="randomMeme()">🎲 Random Meme</button>

<button onclick="downloadMeme()">⬇️ Download</button>

<button onclick="deleteEverything()">🗑️ Delete Everything</button>


</div>


<div class="card">

<canvas id="canvas" width="700" height="500"></canvas>

</div>


<div id="alertBox">

🚨 EMERGENCY ALERT 🚨
<br><br>
Max has pressed the delete button.
<br><br>
Initiating anti-chaos protocols...
<br><br>
🛡️ Backup created successfully.

</div>


<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const imageUpload = document.getElementById("imageUpload");
const topText = document.getElementById("topText");
const bottomText = document.getElementById("bottomText");
const textSize = document.getElementById("textSize");

let img = new Image();


// Load uploaded image
imageUpload.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            img.onload = function(){
                drawMeme();
            }

            img.src = e.target.result;

        }

        reader.readAsDataURL(file);

    }

});


// Update preview when text changes
topText.addEventListener("input", drawMeme);
bottomText.addEventListener("input", drawMeme);
textSize.addEventListener("input", drawMeme);


// Draw meme
function drawMeme(){

    ctx.clearRect(0,0,canvas.width,canvas.height);


    if(img.src){

        let ratio = Math.min(
            canvas.width / img.width,
            canvas.height / img.height
        );


        let width = img.width * ratio;
        let height = img.height * ratio;


        let x = (canvas.width - width) / 2;
        let y = (canvas.height - height) / 2;


        ctx.drawImage(
            img,
            x,
            y,
            width,
            height
        );

    } else {

        ctx.fillStyle = "white";
        ctx.fillRect(0,0,canvas.width,canvas.height);

    }


    let size = textSize.value;

    ctx.font = `bold ${size}px Arial`;
    ctx.textAlign = "center";
    ctx.strokeStyle = "black";
    ctx.fillStyle = "white";
    ctx.lineWidth = 5;


    // Top text
    ctx.strokeText(
        topText.value.toUpperCase(),
        canvas.width/2,
        60
    );

    ctx.fillText(
        topText.value.toUpperCase(),
        canvas.width/2,
        60
    );


    // Bottom text
    ctx.strokeText(
        bottomText.value.toUpperCase(),
        canvas.width/2,
        canvas.height - 40
    );

    ctx.fillText(
        bottomText.value.toUpperCase(),
        canvas.width/2,
        canvas.height - 40
    );

}



// Random meme text
function randomMeme(){

    const tops = [
        "WHEN YOU",
        "ME TRYING TO",
        "NOBODY:",
        "POV:",
        "THAT MOMENT WHEN"
    ];


    const bottoms = [
        "IT ACTUALLY WORKS",
        "EVERYTHING BREAKS",
        "THIS HAPPENS",
        "I REGRET EVERYTHING",
        "ABSOLUTE CHAOS"
    ];


    topText.value =
        tops[Math.floor(Math.random()*tops.length)];


    bottomText.value =
        bottoms[Math.floor(Math.random()*bottoms.length)];


    drawMeme();

}



// Download meme
function downloadMeme(){

    const link = document.createElement("a");

    link.download = "meme.png";

    link.href = canvas.toDataURL();

    link.click();

}



// 🚨 MAX EASTER EGG 🚨
function deleteEverything(){

    const alertBox = document.getElementById("alertBox");

    alertBox.style.display = "block";


    alertBox.innerHTML = `
    🚨 EMERGENCY ALERT 🚨
    <br><br>
    Max has pressed the delete button.
    <br><br>
    Initiating anti-chaos protocols...
    <br><br>
    🛡️ Backup created successfully.
    `;


    // Fake backup message
    console.log(
    "Backup created successfully. Max has been warned 😎"
    );


}

</script>

</body>
</html>
