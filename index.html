<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>😂 Meme Maker</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@400;600&display=swap');

*{
    box-sizing:border-box;
}

body{
    font-family:'Poppins', Arial, sans-serif;
    background:linear-gradient(135deg,#111827,#020617);
    color:white;
    text-align:center;
    padding:30px;
}

.container{
    max-width:700px;
    margin:auto;
    background:rgba(255,255,255,0.1);
    padding:35px;
    border-radius:25px;
}

h1{
    font-family:'Luckiest Guy';
    font-size:55px;
    color:#facc15;
}

.upload-btn, button{
    display:inline-block;
    background:#8b5cf6;
    color:white;
    padding:14px 25px;
    border-radius:50px;
    cursor:pointer;
    margin:10px;
    border:none;
    font-weight:bold;
}

.upload-btn input{
    display:none;
}

.templates img{
    width:120px;
    height:90px;
    object-fit:cover;
    margin:8px;
    border-radius:10px;
    cursor:pointer;
}

canvas{
    max-width:100%;
    margin-top:20px;
    border-radius:15px;
}

input[type="text"]{
    padding:12px;
    margin:8px;
    border-radius:10px;
    width:220px;
}

</style>

</head>


<body>

<div class="container">

<h1>😂 Meme Maker</h1>

<p>Create your dream meme today, with MemeMaker.</p>


<h2>🔥 Meme Templates</h2>


<div class="templates">

<img src="download (1).jfif" onclick="loadTemplate('download (1).jfif')">

<img src="download (2).jfif" onclick="loadTemplate('download (2).jfif')">

<img src="iiuuiui.jfif" onclick="loadTemplate('iiuuiui.jfif')">

<img src="images (1).jfif" onclick="loadTemplate('images (1).jfif')">

<img src="images.jfif" onclick="loadTemplate('images.jfif')">

<img src="ioioioi.jfif" onclick="loadTemplate('ioioioi.jfif')">

<img src="sddefault.jpg" onclick="loadTemplate('sddefault.jpg')">

</div>


<label class="upload-btn">

📷 Choose Meme Image

<input type="file" id="imageInput">

</label>


<br>


<input id="topText" placeholder="Top text">

<input id="bottomText" placeholder="Bottom text">


<br>


<button onclick="makeMeme()">✨ Create Meme</button>

<button onclick="downloadMeme()">⬇ Download</button>


<br>


<canvas id="canvas"></canvas>


</div>



<script>

let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let image = new Image();



function loadTemplate(file){

    image.onload = function(){

        canvas.width = image.width;
        canvas.height = image.height;

        makeMeme();

    }

    image.src = file;

}



document.getElementById("imageInput").onchange=function(e){

    let reader = new FileReader();

    reader.onload=function(event){

        image.onload=function(){

            canvas.width=image.width;
            canvas.height=image.height;

            makeMeme();

        }

        image.src=event.target.result;

    }


    reader.readAsDataURL(e.target.files[0]);

};



function makeMeme(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.drawImage(image,0,0);


    ctx.font="40px Impact";
    ctx.textAlign="center";

    ctx.fillStyle="white";
    ctx.strokeStyle="black";
    ctx.lineWidth=5;


    let top=document.getElementById("topText").value;
    let bottom=document.getElementById("bottomText").value;


    ctx.strokeText(top,canvas.width/2,50);
    ctx.fillText(top,canvas.width/2,50);


    ctx.strokeText(bottom,canvas.width/2,canvas.height-40);
    ctx.fillText(bottom,canvas.width/2,canvas.height-40);

}



function downloadMeme(){

    let link=document.createElement("a");

    link.download="meme.png";

    link.href=canvas.toDataURL();

    link.click();

}


</script>


</body>
</html>
